name: Temporary disable registration email verification

on:
  push:
    branches:
      - fix/meal-status-filter-pills

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meal-status-filter-pills
          fetch-depth: 0

      - name: Preserve optional legacy verification flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("services/api/src/routes/auth-workflows.ts")
          s = p.read_text()

          old = '''       VALUES (?, ?, ?, ?, 'EMAIL_VERIFY', ?, 0, 5, ?, ?, ?, ?, ?)`,
          ).bind(
            emailChallengeId,
            institution.id,
            userId,
            email,
            otpHash,
            clientIp(c),
            new Date(now.getTime() + OTP_TTL_MS).toISOString(),
            EMAIL_VERIFICATION_ENABLED ? null : nowIso,
            nowIso,
            nowIso,
          ),'''
          new = '''       VALUES (?, ?, ?, ?, 'EMAIL_VERIFY', ?, 0, 5, ?, ?, NULL, ?, ?)`,
          ).bind(
            emailChallengeId,
            institution.id,
            userId,
            email,
            otpHash,
            clientIp(c),
            new Date(now.getTime() + OTP_TTL_MS).toISOString(),
            nowIso,
            nowIso,
          ),'''
          if s.count(old) != 1:
              raise SystemExit(f"registration challenge block match count={s.count(old)}")
          s = s.replace(old, new, 1)

          old = '''  if (user.email_verified === 1) {
            return c.json({ success: true, data: { userId: user.id, email: user.email, emailVerified: true } });
          }

          const challenge = await latestChallenge(c, user.id, "EMAIL_VERIFY");
          if (!(await verifyOneTimeChallenge(c, challenge, otp))) {'''
          new = '''  if (user.email_verified === 1 && EMAIL_VERIFICATION_ENABLED) {
            return c.json({ success: true, data: { userId: user.id, email: user.email, emailVerified: true } });
          }

          const challenge = await latestChallenge(c, user.id, "EMAIL_VERIFY");
          // While verification is temporarily optional, old clients may still submit
          // the legacy challenge. Once that challenge is consumed, keep this endpoint
          // idempotent for the already auto-verified account.
          if (user.email_verified === 1 && (!challenge || challenge.consumed_at)) {
            return c.json({ success: true, data: { userId: user.id, email: user.email, emailVerified: true } });
          }
          if (!(await verifyOneTimeChallenge(c, challenge, otp))) {'''
          if s.count(old) != 1:
              raise SystemExit(f"verify-email compatibility block match count={s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check services/api/src/routes/auth-workflows.ts
          grep -q 'user.email_verified === 1 && EMAIL_VERIFICATION_ENABLED' services/api/src/routes/auth-workflows.ts
          grep -q 'challenge.consumed_at' services/api/src/routes/auth-workflows.ts

      - name: Commit compatibility source only
        shell: bash
        run: |
          git config user.name "boardops-ci"
          git config user.email "boardops-ci@users.noreply.github.com"
          git add services/api/src/routes/auth-workflows.ts
          git commit -m "fix: keep optional verification backward compatible"
          git push origin HEAD:fix/meal-status-filter-pills
