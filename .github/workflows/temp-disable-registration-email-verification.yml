name: Temporary disable registration email verification

on:
  push:
    branches:
      - fix/meal-status-filter-pills

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meal-status-filter-pills
          fetch-depth: 0

      - name: Prepare source-only patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/temp_disable_registration_email_verification.py")
          s = p.read_text()
          frontend = s.index('path = "apps/web/src/components/features/auth/auth-screen.tsx"')
          ci = s.index('path = ".github/workflows/ci.yml"', frontend)
          chunk = s[frontend:ci]
          chunk = chunk.replace("'''      ", "'''        ").replace("\n      ", "\n        ")
          s = s[:frontend] + chunk + 'print("Temporary registration email verification source bypass applied")\n'
          p.write_text(s)
          PY

      - name: Apply temporary registration email bypass
        run: python scripts/temp_disable_registration_email_verification.py

      - name: Verify source patch
        shell: bash
        run: |
          git diff --check services/api/src/routes/auth-workflows.ts apps/web/src/components/features/auth/auth-screen.tsx
          grep -q 'const EMAIL_VERIFICATION_ENABLED = false;' services/api/src/routes/auth-workflows.ts
          grep -q 'verificationRequired: EMAIL_VERIFICATION_ENABLED' services/api/src/routes/auth-workflows.ts
          grep -q 'Account created — pending admin approval.' apps/web/src/components/features/auth/auth-screen.tsx

      - name: Commit application source only
        shell: bash
        run: |
          git config user.name "boardops-ci"
          git config user.email "boardops-ci@users.noreply.github.com"
          git add services/api/src/routes/auth-workflows.ts apps/web/src/components/features/auth/auth-screen.tsx
          git commit -m "feat: temporarily skip registration email verification"
          git push origin HEAD:fix/meal-status-filter-pills
