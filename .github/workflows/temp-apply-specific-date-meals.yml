          '''  if (!startTime || !TIME_RE.test(startTime) || !endTime || !TIME_RE.test(endTime)) {
              return { error: "Service start and end times are required" };
            }
            if (!PRICING_MODES.has(pricingMode)) return { error: "Invalid meal pricing mode" };''',
          '''  if (!startTime || !TIME_RE.test(startTime) || !endTime || !TIME_RE.test(endTime)) {
              return { error: "Service start and end times are required" };
