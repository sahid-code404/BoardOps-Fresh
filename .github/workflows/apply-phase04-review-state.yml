name: Apply Phase 04 Review State

on:
  push:
    paths:
      - ".github/workflows/apply-phase04-review-state.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Phase 04 review-state patch
        run: node scripts/patch-phase04-review-state.mjs

      - name: Remove one-time patch machinery
        run: |
          rm scripts/patch-phase04-review-state.mjs
          rm .github/workflows/apply-phase04-review-state.yml

      - name: Commit review-state hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/src/routes/auth-workflows.ts services/api/src/routes/users.ts scripts/patch-phase04-review-state.mjs .github/workflows/apply-phase04-review-state.yml
          git diff --cached --check
          git commit -m "fix: enforce registration review state machine"
          git push origin HEAD:main
