name: Apply Phase 05 RBAC Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-phase05-rbac-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded Phase 05 RBAC integration
        run: node scripts/patch-phase05-rbac-integration.mjs
      - name: Remove one-time patch machinery
        run: rm scripts/patch-phase05-rbac-integration.mjs .github/workflows/apply-phase05-rbac-integration.yml
      - name: Commit integrated RBAC boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Phase 05 integration changes required."
            exit 0
          fi
          git commit -m "fix: complete Phase 05 permission boundary integration"
          git push
