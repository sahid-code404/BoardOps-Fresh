name: Apply Phase 05 RBAC Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-phase05-rbac-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded Phase 05 RBAC integration
        run: node scripts/patch-phase05-rbac-integration.mjs
      - name: Commit integrated RBAC routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/src/routes/auth.ts services/api/src/routes/runtime.ts services/api/src/routes/users.ts
          if git diff --cached --quiet; then
            echo "No Phase 05 route integration changes required."
            exit 0
          fi
          git commit -m "fix: complete Phase 05 permission boundary integration"
          git push
