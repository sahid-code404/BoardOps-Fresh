name: Apply Phase 04 Hardening

on:
  push:
    paths:
      - ".github/workflows/apply-phase04-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Phase 04 hardening
        run: node scripts/patch-phase04-hardening.mjs

      - name: Remove one-time patch machinery
        run: |
          rm scripts/patch-phase04-hardening.mjs
          rm .github/workflows/apply-phase04-hardening.yml

      - name: Commit hardened auth workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/src/routes/auth-workflows.ts apps/web/src/components/features/auth/auth-screen.tsx scripts/patch-phase04-hardening.mjs .github/workflows/apply-phase04-hardening.yml
          git diff --cached --check
          git commit -m "fix: harden Phase 04 auth delivery boundaries"
          git push origin HEAD:main
