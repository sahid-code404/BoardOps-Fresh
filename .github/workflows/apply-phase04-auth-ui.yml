name: Apply Phase 04 Auth UI Patch

on:
  push:
    paths:
      - ".github/workflows/apply-phase04-auth-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded email-resubmit patch
        run: node scripts/patch-phase04-auth-email-resubmit.mjs

      - name: Remove one-time patch machinery
        run: |
          rm scripts/patch-phase04-auth-email-resubmit.mjs
          rm .github/workflows/apply-phase04-auth-ui.yml

      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/features/auth/auth-screen.tsx scripts/patch-phase04-auth-email-resubmit.mjs .github/workflows/apply-phase04-auth-ui.yml
          git diff --cached --check
          git commit -m "fix: complete email correction verification flow"
          git push origin HEAD:main
