name: Apply admin workflow batch two

on:
  push:
    branches: [feature/admin-workflow-rules]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-workflow-rules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - name: Harden literal regex replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-admin-workflow-batch2.py')
          text = p.read_text()
          old = "updated, count = re.subn(pattern, repl, text, count=1, flags=re.S)"
          new = "updated, count = re.subn(pattern, lambda _match: repl, text, count=1, flags=re.S)"
          if text.count(old) != 1:
              raise SystemExit(f'expected one regex helper call, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply guarded batch two
        run: python scripts/apply-admin-workflow-batch2.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Reset migrate seed and verify D1
        run: pnpm db:reset:local
      - name: Commit validated batch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps services migrations tests package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 0
          fi
          git commit -m "feat: refine admin workflows and meal lifecycle"
          git push origin HEAD:feature/admin-workflow-rules
