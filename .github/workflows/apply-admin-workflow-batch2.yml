name: Validate admin workflow audit fixes

on:
  push:
    branches: [feature/admin-workflow-rules]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-workflow-rules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - name: Apply audit hardening fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          meal_api = 'services/api/src/routes/meals-config.ts'
          replace_once(
              meal_api,
              """    if (!cycle) continue;\n\n    const settlement = await c.env.DB.prepare(""",
              """    if (!cycle) continue;\n\n    // The requested meal remains service-active through the eligible billing\n    // month so every confirmed entry is captured by that month's immutable\n    // bill snapshot. Once that billing cycle closes, stop future service even\n    // if resident balances/refunds still need time to settle.\n    const serviceEndedAt = new Date().toISOString();\n    const serviceEnd = await c.env.DB.prepare(\n      `UPDATE meal_configurations\n          SET status = 'ARCHIVED', updated_at = ?\n        WHERE id = ? AND institution_id = ?\n          AND deletion_finalized_at IS NULL AND status <> 'ARCHIVED'`,\n    ).bind(serviceEndedAt, meal.id, principal.institutionId).run();\n    if (Number(serviceEnd.meta.changes ?? 0) > 0) {\n      await writeAudit(c, principal, \"MEAL_CONFIGURATION_DELETION_SERVICE_ENDED\", meal.id, {\n        eligibleMonth: meal.deletion_eligible_month,\n        eligibleYear: meal.deletion_eligible_year,\n      });\n    }\n\n    const settlement = await c.env.DB.prepare("""
          )
          replace_once(
              meal_api,
              """    `UPDATE meal_configurations\n        SET status = 'ARCHIVED', deletion_requested_at = ?,\n            deletion_eligible_month = ?, deletion_eligible_year = ?,""",
              """    `UPDATE meal_configurations\n        SET deletion_requested_at = ?,\n            deletion_eligible_month = ?, deletion_eligible_year = ?,"""
          )

          meal_ui = 'apps/web/src/components/features/meals/meals-config-view.tsx'
          replace_once(
              meal_ui,
              """      displayOrder: existingMeals.filter((meal) => !meal.deletionRequestedAt).length,""",
              """      displayOrder: existingMeals.length,"""
          )
          replace_once(
              meal_ui,
              """      .filter((meal) => !meal.deletionRequestedAt && meal.id !== mealId)""",
              """      .filter((meal) => meal.id !== mealId)"""
          )

          meal_test = 'tests/runtime-e2e/meals-config.spec.ts'
          replace_once(
              meal_test,
              """      body: JSON.stringify({ status: \"INACTIVE\", displayName: \"Runtime Test Snack Updated\" }),""",
              """      body: JSON.stringify({ displayName: \"Runtime Test Snack Updated\" }),"""
          )
          replace_once(
              meal_test,
              """    data: { name: \"runtime_test_snack\", displayName: \"Runtime Test Snack Updated\", status: \"INACTIVE\" },""",
              """    data: { name: \"runtime_test_snack\", displayName: \"Runtime Test Snack Updated\", status: \"ACTIVE\" },"""
          )
          replace_once(
              meal_test,
              """      meal: { name: \"runtime_test_snack\", status: \"ARCHIVED\" },""",
              """      meal: { name: \"runtime_test_snack\", status: \"ACTIVE\" },"""
          )

          expense_api = 'services/api/src/routes/expenses.ts'
          replace_once(
              expense_api,
              """  if (existing.proof_key && existing.proof_key !== key) {\n    await c.env.FILES.delete(existing.proof_key);\n  }""",
              """  if (existing.proof_key && existing.proof_key !== key) {\n    // Replacement expenses deliberately inherit the original proof reference.\n    // Never delete an R2 object while another historical expense row still\n    // points at it, otherwise the immutable REVERSED evidence becomes broken.\n    const sharedProof = await c.env.DB.prepare(\n      `SELECT COUNT(*) AS count FROM expenses\n        WHERE institution_id = ? AND proof_key = ? AND id <> ?`,\n    ).bind(principal.institutionId, existing.proof_key, existing.id).first<{ count: number }>();\n    if (Number(sharedProof?.count ?? 0) === 0) {\n      await c.env.FILES.delete(existing.proof_key);\n    }\n  }"""
          )

          expense_test = 'tests/runtime-e2e/expenses.spec.ts'
          replace_once(
              expense_test,
              """    const createKey = \"expenses-admin-e2e-create-v1\";""",
              """    const missingQuantity = await request(\"/api/expenses\", {\n      method: \"POST\",\n      headers: { \"Idempotency-Key\": \"expenses-admin-e2e-missing-quantity-v1\" },\n      body: JSON.stringify({\n        title: \"Missing quantity expense\",\n        category: \"GENERAL\",\n        unit: \"piece\",\n        amount: 10,\n        expenseDate: \"2026-08-25T12:00:00.000Z\",\n      }),\n    });\n\n    const createKey = \"expenses-admin-e2e-create-v1\";"""
          )
          replace_once(
              expense_test,
              """    const createdId = created.body?.data?.id as string;\n    const replacement = await request(`/api/expenses/${createdId}`, {""",
              """    const createdId = created.body?.data?.id as string;\n    const missingEditReason = await request(`/api/expenses/${createdId}`, {\n      method: \"PUT\",\n      headers: { \"Idempotency-Key\": \"expenses-admin-e2e-missing-reason-v1\" },\n      body: JSON.stringify({\n        ...createPayload,\n        title: \"Runtime groceries invalid correction\",\n        amount: 222.22,\n      }),\n    });\n    const replacement = await request(`/api/expenses/${createdId}`, {"""
          )
          replace_once(
              expense_test,
              """      fractionalPaise,\n      created,""",
              """      fractionalPaise,\n      missingQuantity,\n      created,"""
          )
          replace_once(
              expense_test,
              """      replay,\n      replacement,""",
              """      replay,\n      missingEditReason,\n      replacement,"""
          )
          replace_once(
              expense_test,
              """  expect(String(result.fractionalPaise.body.error)).toContain(\"at most two decimal places\");\n\n  expect(result.created.status).toBe(201);""",
              """  expect(String(result.fractionalPaise.body.error)).toContain(\"at most two decimal places\");\n  expect(result.missingQuantity.status).toBe(422);\n  expect(String(result.missingQuantity.body.error)).toContain(\"Quantity is required\");\n\n  expect(result.created.status).toBe(201);"""
          )
          replace_once(
              expense_test,
              """  expect(result.replay.body.data.amount).toBe(123.45);\n\n  expect(result.replacement.status).toBe(200);""",
              """  expect(result.replay.body.data.amount).toBe(123.45);\n  expect(result.missingEditReason.status).toBe(422);\n  expect(String(result.missingEditReason.body.error)).toContain(\"Edit reason is required\");\n\n  expect(result.replacement.status).toBe(200);"""
          )
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Reset migrate seed and verify D1
        run: pnpm db:reset:local
      - name: Commit validated audit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps services tests
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 0
          fi
          git commit -m "fix: preserve deferred meal billing and expense proofs"
          git push origin HEAD:feature/admin-workflow-rules
