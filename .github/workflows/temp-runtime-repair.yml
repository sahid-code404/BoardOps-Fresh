name: Temporary runtime repair

on:
  push:
    branches:
      - fix/meal-status-filter-pills

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meal-status-filter-pills
          fetch-depth: 0

      - name: Apply runtime repairs
        run: |
          python scripts/temp_fix_runtime_tests.py
          python scripts/temp_fix_registration_pending_email.py

      - name: Validate repair shape
        run: |
          git diff --check
          grep -q 'billingCurrentKey - july2026Key' tests/runtime-e2e/billing.spec.ts
          grep -q 'expensesCurrentKey - august2026Key' tests/runtime-e2e/expenses.spec.ts
          grep -q 'latestClosableKey - may2026Key' tests/runtime-e2e/monthly-closing.spec.ts
          grep -q 'reportsCurrentKey - august2026Key' tests/runtime-e2e/reports.spec.ts
          grep -q 'toHaveCount(0)' tests/runtime-e2e/registration-workflow.spec.ts
          grep -q 'const oneTimeDate = "2026-09-15"' tests/runtime-e2e/resident-meals-leave.spec.ts
          grep -q 'onPendingEmailChanged(result.email)' apps/web/src/components/features/auth/auth-screen.tsx

      - name: Commit runtime repairs
        run: |
          git config user.name "boardops-ci"
          git config user.email "boardops-ci@users.noreply.github.com"
          git add \
            apps/web/src/components/features/auth/auth-screen.tsx \
            tests/runtime-e2e/billing.spec.ts \
            tests/runtime-e2e/expenses.spec.ts \
            tests/runtime-e2e/monthly-closing.spec.ts \
            tests/runtime-e2e/registration-workflow.spec.ts \
            tests/runtime-e2e/reports.spec.ts \
            tests/runtime-e2e/resident-meals-leave.spec.ts \
            tests/runtime-e2e/residents-users.spec.ts
          git commit -m "test: make runtime suite rollover-safe"
          git push origin HEAD:fix/meal-status-filter-pills
