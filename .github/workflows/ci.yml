name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      lock_ready: ${{ steps.lock.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - id: lock
        name: Validate deterministic lockfile
        shell: bash
        run: |
          if [[ ! -f pnpm-lock.yaml ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if pnpm install --lockfile-only --frozen-lockfile; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  bootstrap-lockfile:
    needs: prepare
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.lock_ready == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit deterministic lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: refresh pnpm lockfile"
          git push

  verify:
    needs: prepare
    if: ${{ needs.prepare.outputs.lock_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Reset, migrate, seed and verify local D1
        run: pnpm db:reset:local
      - name: Start Worker and verify health/readiness/auth/dashboard/profile actions
        shell: bash
        run: |
          pnpm --filter @boardops/api dev > /tmp/boardops-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          healthy=false
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then healthy=true; break; fi
            sleep 1
          done
          if [[ "$healthy" != "true" ]]; then cat /tmp/boardops-api.log; exit 1; fi

          curl --fail --show-error http://127.0.0.1:8787/api/health
          curl --fail --show-error http://127.0.0.1:8787/api/ready > /tmp/ready.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/ready.json','utf8')); if(x.status!=='ready'||x.schema!=='phase04-auth-workflows') process.exit(1)"
          curl --fail --show-error http://127.0.0.1:8787/api/theme > /tmp/theme.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/theme.json','utf8')); if(!x.success||x.data?.glassMode!=='on'||x.data?.blurIntensity!=='normal') process.exit(1)"

          bad_status=$(curl --silent --output /tmp/bad-login.json --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"email":"admin@boardops.local","password":"wrong-password"}' \
            http://127.0.0.1:8787/api/auth/login)
          test "$bad_status" = "401"

          curl --fail --show-error --cookie-jar /tmp/boardops-cookies.txt \
            -H 'content-type: application/json' \
            -d '{"email":"admin@boardops.local","password":"BoardOps@Fresh#2026!A7"}' \
            http://127.0.0.1:8787/api/auth/login > /tmp/login.json

          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/login.json','utf8')); if(!x.success||x.data?.user?.id!=='usr_admin_local'||x.data?.token!=='cookie-session') process.exit(1)"

          curl --fail --show-error --cookie /tmp/boardops-cookies.txt \
            http://127.0.0.1:8787/api/auth/me > /tmp/me.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/me.json','utf8')); if(!x.success||x.data?.email!=='admin@boardops.local'||x.data?.role!=='ADMIN') process.exit(1)"

          curl --fail --show-error --cookie /tmp/boardops-cookies.txt \
            http://127.0.0.1:8787/api/dashboard > /tmp/dashboard.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/dashboard.json','utf8')); if(!x.success||x.data?.isAdmin!==true||x.data?.kpis?.totalUsers!==2||!Array.isArray(x.data?.recentActivity)) process.exit(1)"

          curl --fail --show-error --cookie /tmp/boardops-cookies.txt \
            'http://127.0.0.1:8787/api/notifications?unread=true' > /tmp/notifications.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/notifications.json','utf8')); if(!x.success||x.data?.unreadCount!==0||!Array.isArray(x.data?.notifications)) process.exit(1)"

          curl --fail --show-error --cookie /tmp/boardops-cookies.txt \
            http://127.0.0.1:8787/api/auth/profile > /tmp/profile.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/profile.json','utf8')); if(!x.success||x.data?.name!=='BoardOps Admin'||x.data?.status!=='ACTIVE') process.exit(1)"

          # Phase 04 registration -> verification -> review -> resubmit -> approve.
          curl --fail --show-error --cookie-jar /tmp/registration-cookies.txt \
            -H 'content-type: application/json' \
            -d '{"name":"Phase Four User","institutionName":"BoardOps Institute","institutionUserId":"RES-PHASE04","email":"phase04.user@example.test","phone":"+919876540004","password":"BoardOps@Test#2026!C9","confirmPassword":"BoardOps@Test#2026!C9","room":"D-401","gender":"OTHER","consents":{"rules":true,"privacy":true,"terms":true}}' \
            http://127.0.0.1:8787/api/auth/register > /tmp/register.json
          registration_user_id=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/register.json','utf8')); if(!x.success||!x.data?.userId||x.data?.email!=='phase04.user@example.test'||x.data?.registrationToken||x.data?.otp) process.exit(1); process.stdout.write(x.data.userId)")
          grep -q 'boardops_registration' /tmp/registration-cookies.txt

          wrong_otp_status=$(curl --silent --output /tmp/wrong-verify.json --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"email":"phase04.user@example.test","otp":"111111"}' \
            http://127.0.0.1:8787/api/auth/verify-email)
          test "$wrong_otp_status" = "400"

          curl --fail --show-error \
            -H 'content-type: application/json' \
            -d '{"email":"phase04.user@example.test","otp":"424242"}' \
            http://127.0.0.1:8787/api/auth/verify-email > /tmp/verify-email.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/verify-email.json','utf8')); if(!x.success||x.data?.emailVerified!==true) process.exit(1)"

          curl --fail --show-error \
            'http://127.0.0.1:8787/api/auth/registration-status?email=phase04.user%40example.test' > /tmp/status-anon.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/status-anon.json','utf8')); if(!x.success||x.data?.exists!==false) process.exit(1)"

          curl --fail --show-error --cookie /tmp/registration-cookies.txt \
            'http://127.0.0.1:8787/api/auth/registration-status?email=phase04.user%40example.test' > /tmp/status-pending.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/status-pending.json','utf8')); if(!x.success||x.data?.exists!==true||x.data?.status!=='PENDING'||x.data?.emailVerified!==true||x.data?.cycle!==1) process.exit(1)"

          curl --fail --show-error --cookie /tmp/boardops-cookies.txt \
            'http://127.0.0.1:8787/api/users?q=phase04.user%40example.test' > /tmp/users-phase04.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/users-phase04.json','utf8')); if(!x.success||!x.data?.some(u=>u.email==='phase04.user@example.test'&&u.status==='PENDING'&&u.emailVerified===true)) process.exit(1)"

          curl --fail --show-error --cookie /tmp/boardops-cookies.txt \
            -X PATCH -H 'content-type: application/json' \
            -d '{"fields":["room"],"reason":"Please confirm the corrected room assignment"}' \
            "http://127.0.0.1:8787/api/users/${registration_user_id}/request-changes" > /tmp/request-changes.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/request-changes.json','utf8')); if(!x.success||x.data?.status!=='PENDING'||!x.data?.changesRequested?.includes('room')) process.exit(1)"

          curl --fail --show-error --cookie /tmp/registration-cookies.txt \
            'http://127.0.0.1:8787/api/auth/registration-status?email=phase04.user%40example.test' > /tmp/status-changes.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/status-changes.json','utf8')); if(!x.success||!x.data?.changesRequested?.includes('room')||!x.data?.changesRequestReason) process.exit(1)"

          curl --fail --show-error --cookie /tmp/registration-cookies.txt \
            -H 'content-type: application/json' \
            -d '{"email":"phase04.user@example.test","name":"Phase Four User","institutionUserId":"RES-PHASE04","phone":"+919876540004","room":"D-402","gender":"OTHER"}' \
            http://127.0.0.1:8787/api/auth/resubmit > /tmp/resubmit.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/resubmit.json','utf8')); if(!x.success||x.data?.cycle!==2||x.data?.status!=='PENDING'||x.data?.verificationRequired!==false) process.exit(1)"

          curl --fail --show-error --cookie /tmp/registration-cookies.txt \
            'http://127.0.0.1:8787/api/auth/registration-status?email=phase04.user%40example.test' > /tmp/status-cycle2.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/status-cycle2.json','utf8')); if(!x.success||x.data?.cycle!==2||x.data?.reviewStatus!=='PENDING_REVIEW'||x.data?.room!=='D-402') process.exit(1)"

          curl --fail --show-error --cookie /tmp/boardops-cookies.txt \
            -X PATCH -H 'content-type: application/json' \
            -d '{"action":"APPROVE","reason":"Phase 04 CI approval"}' \
            "http://127.0.0.1:8787/api/users/${registration_user_id}" > /tmp/approve.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/approve.json','utf8')); if(!x.success||x.data?.status!=='ACTIVE') process.exit(1)"

          curl --fail --show-error --cookie-jar /tmp/phase04-user-cookies.txt \
            -H 'content-type: application/json' \
            -d '{"email":"phase04.user@example.test","password":"BoardOps@Test#2026!C9"}' \
            http://127.0.0.1:8787/api/auth/login > /tmp/phase04-user-login.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/phase04-user-login.json','utf8')); if(!x.success||x.data?.user?.id!=='$registration_user_id') process.exit(1)"

          # Password recovery must not enumerate accounts and must revoke all old sessions.
          curl --fail --show-error -H 'content-type: application/json' \
            -d '{"email":"nobody-phase04@example.test"}' \
            http://127.0.0.1:8787/api/auth/forgot-password > /tmp/forgot-unknown.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/forgot-unknown.json','utf8')); if(!x.success||x.data?.sent!==true) process.exit(1)"

          curl --fail --show-error -H 'content-type: application/json' \
            -d '{"email":"phase04.user@example.test"}' \
            http://127.0.0.1:8787/api/auth/forgot-password > /tmp/forgot-real.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/forgot-real.json','utf8')); if(!x.success||x.data?.sent!==true) process.exit(1)"

          curl --fail --show-error -H 'content-type: application/json' \
            -d '{"email":"phase04.user@example.test","otp":"424242"}' \
            http://127.0.0.1:8787/api/auth/verify-reset-otp > /tmp/reset-otp.json
          reset_token=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/reset-otp.json','utf8')); if(!x.success||x.data?.verified!==true||!x.data?.resetToken) process.exit(1); process.stdout.write(x.data.resetToken)")

          RESET_TOKEN="$reset_token" node -e "const fs=require('fs'); fs.writeFileSync('/tmp/reset-body.json', JSON.stringify({email:'phase04.user@example.test',resetToken:process.env.RESET_TOKEN,newPassword:'BoardOps@Reset#2026!D0'}))"
          curl --fail --show-error -H 'content-type: application/json' \
            --data-binary @/tmp/reset-body.json \
            http://127.0.0.1:8787/api/auth/reset-password > /tmp/reset-password.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/reset-password.json','utf8')); if(!x.success||x.data?.reset!==true) process.exit(1)"

          revoked_status=$(curl --silent --output /tmp/revoked-me.json --write-out '%{http_code}' \
            --cookie /tmp/phase04-user-cookies.txt \
            http://127.0.0.1:8787/api/auth/me)
          test "$revoked_status" = "401"

          curl --fail --show-error --cookie-jar /tmp/phase04-user-new-cookies.txt \
            -H 'content-type: application/json' \
            -d '{"email":"phase04.user@example.test","password":"BoardOps@Reset#2026!D0"}' \
            http://127.0.0.1:8787/api/auth/login > /tmp/phase04-user-new-login.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/phase04-user-new-login.json','utf8')); if(!x.success||x.data?.user?.id!=='$registration_user_id') process.exit(1)"

          # Active Sessions is a visible Profile action. The API must return
          # presentation-ready device/browser/OS data rather than undefined UI.
          curl --fail --show-error --cookie /tmp/boardops-cookies.txt \
            http://127.0.0.1:8787/api/auth/sessions > /tmp/sessions.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/sessions.json','utf8')); const s=x.data?.find(v=>v.current); if(!x.success||!s||!s.device||!s.browser||!s.os||!s.createdAt) process.exit(1)"

          # Avatar upload is visible in Profile and must be backed by local R2.
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZJ3sAAAAASUVORK5CYII=' | base64 -d > /tmp/avatar.png
          curl --fail --show-error --cookie /tmp/boardops-cookies.txt \
            -F 'avatar=@/tmp/avatar.png;type=image/png' \
            http://127.0.0.1:8787/api/auth/avatar > /tmp/avatar.json
          avatar_url=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/avatar.json','utf8')); if(!x.success||!x.data?.avatarUrl) process.exit(1); process.stdout.write(x.data.avatarUrl)")
          curl --fail --show-error --cookie /tmp/boardops-cookies.txt \
            "http://127.0.0.1:8787${avatar_url}" --output /tmp/avatar-roundtrip.png
          test -s /tmp/avatar-roundtrip.png

          # Change Password is another visible Profile action. Keep the current
          # session, revoke other sessions, and prove the mutation completes.
          curl --fail --show-error --cookie /tmp/boardops-cookies.txt \
            -H 'content-type: application/json' \
            -d '{"currentPassword":"BoardOps@Fresh#2026!A7","newPassword":"BoardOps@Temp#2026!B8"}' \
            http://127.0.0.1:8787/api/auth/change-password > /tmp/change-password.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/change-password.json','utf8')); if(!x.success||x.data?.changed!==true||x.data?.otherSessionsRevoked!==true) process.exit(1)"

          curl --fail --show-error --cookie /tmp/boardops-cookies.txt --cookie-jar /tmp/boardops-cookies.txt \
            -X POST http://127.0.0.1:8787/api/auth/logout > /tmp/logout.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/logout.json','utf8')); if(!x.success||x.data?.loggedOut!==true) process.exit(1)"
      - name: Start frontend and smoke index
        shell: bash
        run: |
          pnpm --filter @boardops/web dev > /tmp/boardops-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID || true' EXIT
          healthy=false
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then healthy=true; break; fi
            sleep 1
          done
          if [[ "$healthy" != "true" ]]; then cat /tmp/boardops-web.log; exit 1; fi
          curl --fail --show-error http://127.0.0.1:5173/ >/dev/null

  visual-smoke:
    needs: [prepare, verify]
    if: ${{ needs.prepare.outputs.lock_ready == 'true' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Phase 02 visual fixture smoke
        run: pnpm test:e2e

  runtime-smoke:
    needs: [prepare, verify]
    if: ${{ needs.prepare.outputs.lock_ready == 'true' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Reset local D1 for real-runtime browser smoke
        run: pnpm db:reset:local
      - name: Start BoardOps and run real D1 browser smoke
        shell: bash
        run: |
          node scripts/dev.mjs > /tmp/boardops-runtime.log 2>&1 &
          DEV_PID=$!
          cleanup() {
            kill -TERM "$DEV_PID" 2>/dev/null || true
            for i in $(seq 1 20); do
              if ! kill -0 "$DEV_PID" 2>/dev/null; then return; fi
              sleep 0.25
            done
            kill -KILL "$DEV_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then ready=true; break; fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then cat /tmp/boardops-runtime.log; exit 1; fi
            sleep 0.5
          done
          if [[ "$ready" != "true" ]]; then cat /tmp/boardops-runtime.log; exit 1; fi

          pnpm test:e2e:runtime