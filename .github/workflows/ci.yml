name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      lock_ready: ${{ steps.lock.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - id: lock
        name: Validate deterministic lockfile
        shell: bash
        run: |
          if [[ ! -f pnpm-lock.yaml ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if pnpm install --lockfile-only --frozen-lockfile; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  bootstrap-lockfile:
    needs: prepare
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.lock_ready == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit deterministic lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: refresh pnpm lockfile"
          git push

  verify:
    needs: prepare
    if: ${{ needs.prepare.outputs.lock_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Apply local D1 migrations
        run: pnpm db:migrate:local
      - name: Seed local D1
        run: pnpm db:seed:local
      - name: Start Worker and verify health/readiness
        shell: bash
        run: |
          pnpm --filter @boardops/api dev > /tmp/boardops-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          healthy=false
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then healthy=true; break; fi
            sleep 1
          done
          if [[ "$healthy" != "true" ]]; then cat /tmp/boardops-api.log; exit 1; fi
          curl --fail --show-error http://127.0.0.1:8787/api/health
          curl --fail --show-error http://127.0.0.1:8787/api/ready
      - name: Start frontend and smoke index
        shell: bash
        run: |
          pnpm --filter @boardops/web dev > /tmp/boardops-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID || true' EXIT
          healthy=false
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then healthy=true; break; fi
            sleep 1
          done
          if [[ "$healthy" != "true" ]]; then cat /tmp/boardops-web.log; exit 1; fi
          curl --fail --show-error http://127.0.0.1:5173/ >/dev/null
