name: Remove false cutoff preview default

on:
  push:
    branches: [feature/admin-workflow-rules]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-workflow-rules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - name: Patch blank cutoff preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/components/features/meals/meals-config-view.tsx')
          text = p.read_text()
          old = '''function computeCutoffPreview(\n  strategy: string,\n  cutoffTime: string,\n  offsetMinutes: number\n): string {\n  const time12 = formatTime12(cutoffTime);'''
          new = '''function computeCutoffPreview(\n  strategy: string,\n  cutoffTime: string,\n  offsetMinutes: number\n): string {\n  if (!strategy || !cutoffTime) return "Choose cutoff strategy and time";\n  const time12 = formatTime12(cutoffTime);'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one cutoff preview function, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit source and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/patch-cutoff-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/features/meals/meals-config-view.tsx .github/workflows/patch-cutoff-preview.yml
          git commit -m "fix: keep cutoff creation explicitly unset"
          git push origin HEAD:feature/admin-workflow-rules
