name: Temporary unify billing flow

on:
  push:
    branches:
      - fix/meal-status-filter-pills

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meal-status-filter-pills
          fetch-depth: 0

      - name: Apply unified billing flow
        run: python scripts/temp_unify_billing_flow.py

      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          ! grep -q 'Generate Bills' apps/web/src/components/features/billing/billing-view.tsx
          grep -q 'setView("monthly-closing")' apps/web/src/components/features/billing/billing-view.tsx
          grep -q 'Generate Bills & Close Month' apps/web/src/components/features/billing/monthly-closing-view.tsx
          grep -q 'Bills are generated only through Monthly Closing' services/api/src/routes/billing.ts
          grep -q 'manualGenerate.status).toBe(409)' tests/runtime-e2e/billing.spec.ts

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "boardops-ci"
          git config user.email "boardops-ci@users.noreply.github.com"
          git add \
            apps/web/src/components/features/billing/billing-view.tsx \
            apps/web/src/components/features/billing/monthly-closing-view.tsx \
            services/api/src/routes/billing.ts \
            tests/runtime-e2e/billing.spec.ts \
            tests/runtime-e2e/monthly-closing.spec.ts \
            tests/e2e/monthly-closing-visual.spec.ts
          git commit -m "refactor: make monthly closing own bill generation"
          git push origin HEAD:fix/meal-status-filter-pills
